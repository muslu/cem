name: Release

on:
  push:
    tags:
      - 'v*.*.*'        # legacy semver: v0.1.x
      - '20[0-9][0-9][0-9][0-9][0-9][0-9].*'  # calendar: YYYYMMDD.MINOR (örn. 20260525.01)

permissions:
  contents: write

# Actions runner'larının Node 20 → 24 geçişi (Eylül 2026'ya kadar opt-in).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, ext: "" }
          - { os: linux,   arch: arm64, ext: "" }
          - { os: linux,   arch: arm,   ext: "" }
          - { os: darwin,  arch: amd64, ext: "" }
          - { os: darwin,  arch: arm64, ext: "" }
          - { os: windows, arch: amd64, ext: ".exe" }
          - { os: windows, arch: arm64, ext: ".exe" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build cem / cemi / cemir
        env:
          GOOS:   ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          SUFFIX="-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          VERSION="${GITHUB_REF_NAME:-dev}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          for name in cem cemi cemir; do
            out="dist/${name}${SUFFIX}"
            echo "→ $out  (version=$VERSION)"
            go build -trimpath -ldflags="$LDFLAGS" -o "$out" .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cem-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  build-intellij-plugin:
    name: IntelliJ plugin
    runs-on: ubuntu-latest
    continue-on-error: true   # don't block binary release if plugin build fails
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        # Gradle sürümü wrapper'dan (9.3.1) geliyor — runner'ın varsayılan
        # Gradle'ı güncellendiğinde build sessizce değişmesin.

      - name: Sync pluginVersion to tag
        working-directory: plugin/intellij
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^pluginVersion = .*/pluginVersion = ${VERSION}/" gradle.properties
          grep pluginVersion gradle.properties

      - name: Build plugin
        working-directory: plugin/intellij
        run: ./gradlew buildPlugin --no-daemon --warning-mode all

      - name: Rename + version-less alias
        working-directory: plugin/intellij/build/distributions
        run: |
          ls -la
          TARGET="cem-intellij-${GITHUB_REF_NAME}.zip"
          for f in *.zip; do
            if [ "$f" != "$TARGET" ]; then
              mv "$f" "$TARGET"
            fi
          done
          # Sürümsüz kopya — /releases/latest/download/cem-intellij.zip için
          cp "$TARGET" cem-intellij.zip
          ls -la

      # JetBrains eklentisi Marketplace'te değil, diskten kuruluyor; diskten
      # kurulan eklenti hiç güncellenmez (kullanıcı 20260909.02'de kaldı).
      # Custom plugin repository bunu çözer: IDE bu XML'i periyodik yoklar,
      # version alanı kurulu sürümden yeniyse güncellemeyi kendisi indirir.
      # URL sabit (latest/download), içerik her release'de yenilenir.
      - name: updatePlugins.xml (custom plugin repository)
        working-directory: plugin/intellij/build/distributions
        run: |
          cat > updatePlugins.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="dev.cempw.intellij"
                    url="https://github.com/muslu/cem/releases/latest/download/cem-intellij.zip"
                    version="${GITHUB_REF_NAME}">
              <idea-version since-build="233"/>
              <name>cem</name>
              <description>Run the cem CLI from inside PyCharm / IntelliJ IDEA / GoLand / WebStorm.</description>
            </plugin>
          </plugins>
          XML
          cat updatePlugins.xml

      - uses: actions/upload-artifact@v4
        with:
          name: cem-intellij-plugin
          path: |
            plugin/intellij/build/distributions/*.zip
            plugin/intellij/build/distributions/updatePlugins.xml

  # Marketplace yayını. build-intellij-plugin'den AYRI: o job continue-on-error
  # olduğu için publish adımı oraya konsaydı hata sessizce yutulurdu.
  #
  # Kapalı doğar: repo değişkeni PUBLISH_MARKETPLACE=true yapılana kadar
  # çalışmaz. İlk yayın Marketplace'e ELLE yüklenmek zorunda ve moderasyondan
  # geçmesi gerekiyor; onay gelmeden bu job'ı açmak anlamsız.
  #
  # Gerekli secret'lar (Settings → Secrets and variables → Actions):
  #   PUBLISH_TOKEN         — plugins.jetbrains.com/author/me/tokens
  #   CERTIFICATE_CHAIN     — chain.crt içeriği
  #   PRIVATE_KEY           — private.pem içeriği
  #   PRIVATE_KEY_PASSWORD  — anahtar parolası
  publish-intellij-plugin:
    name: IntelliJ plugin → Marketplace
    runs-on: ubuntu-latest
    needs: build-intellij-plugin
    if: ${{ vars.PUBLISH_MARKETPLACE == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Sync pluginVersion to tag
        working-directory: plugin/intellij
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^pluginVersion = .*/pluginVersion = ${VERSION}/" gradle.properties
          grep pluginVersion gradle.properties

      # Marketplace moderasyonundan önce API uyumluluğunu doğrula — verifier
      # hatası publish'i durdursun, kullanıcıya kırık eklenti gitmesin.
      - name: Verify plugin
        working-directory: plugin/intellij
        run: ./gradlew verifyPlugin --no-daemon

      # publishPlugin, signPlugin'i kendisi çalıştırır.
      - name: Publish plugin
        working-directory: plugin/intellij
        env:
          PUBLISH_TOKEN:        ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN:    ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY:          ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin --no-daemon

  build-vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync version to tag (semver-coerced)
        working-directory: plugin/vscode
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          # VS Code Marketplace strict semver ister (3 segment); calendar tag
          # 'YYYYMMDD.MM' 2 segmentli olduğundan '.0' ekleyerek geçerli semver
          # üretiyoruz: 20260525.03 → 20260525.3.0
          if [[ "$RAW" == *.*.* ]]; then
            VERSION="$RAW"
          else
            MAJOR="${RAW%%.*}"
            MINOR="${RAW##*.}"
            # Strip leading zeros from MINOR (semver doesn't allow them)
            MINOR=$((10#$MINOR))
            VERSION="${MAJOR}.${MINOR}.0"
          fi
          echo "Tag: $RAW → semver: $VERSION"
          node -e "let p=require('./package.json');p.version='${VERSION}';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2));"
          grep '"version"' package.json | head

      - name: Install deps + compile + package
        working-directory: plugin/vscode
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run compile
          ls -la dist/
          # Outfile keeps the tag-format for download URL consistency
          npx vsce package --no-dependencies --out "cem-vscode-${GITHUB_REF_NAME}.vsix"
          # Sürümsüz kopya — /releases/latest/download/cem-vscode.vsix için
          cp "cem-vscode-${GITHUB_REF_NAME}.vsix" cem-vscode.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: cem-vscode-extension
          path: plugin/vscode/*.vsix

  build-mcp-server:
    name: MCP server (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, ext: "" }
          - { os: linux,   arch: arm64, ext: "" }
          - { os: darwin,  arch: amd64, ext: "" }
          - { os: darwin,  arch: arm64, ext: "" }
          - { os: windows, arch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build cem-mcp
        working-directory: plugin/mcp
        env:
          GOOS:   ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          OUT="dist/cem-mcp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "$OUT" .
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: cem-mcp-${{ matrix.os }}-${{ matrix.arch }}
          path: plugin/mcp/dist/*

  release:
    # Tüm build job'larını bekle — plugin'ler continue-on-error olduğundan
    # başarısız olsalar bile bu job çalışır (if: always). 'build' başarılı
    # olduğu sürece release publish edilir; plugin artifact'leri varsa eklenir.
    needs: [build, build-intellij-plugin, build-vscode-extension, build-mcp-server]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
