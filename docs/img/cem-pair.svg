<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <style>
    .bg{fill:#11151c} .bar{fill:#1c2330} .dim{fill:#7c8798} .txt{fill:#d6dde8}
    .think{fill:#7fb2ff;font-weight:700} .write{fill:#7fd39b;font-weight:700}
    .cmd{fill:#ffd479} .rule{stroke:#303a4a;stroke-width:1}
  </style>

  <rect class="bg" x="0" y="0" width="900" height="470" rx="10"/>
  <rect class="bar" x="0" y="0" width="900" height="34"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="17" r="6" fill="#febc2e"/>
  <circle cx="62" cy="17" r="6" fill="#28c840"/>
  <text class="dim" x="88" y="22">cem — pair mode</text>

  <text class="dim" x="24" y="70">$</text>
  <text class="cmd" x="42" y="70">cem -p "add retries to client.go"</text>

  <text class="think" x="24" y="108">🧠 THINKING · gpt</text>
  <text class="dim" x="240" y="108">gpt-5.6-terra · xhigh</text>

  <text class="txt" x="24" y="140">- File: client.go</text>
  <text class="txt" x="24" y="164">- Function: func withRetry(fn func() error, n int) error</text>
  <text class="txt" x="24" y="188">- Approach: exponential backoff, doubling the wait each attempt</text>
  <text class="txt" x="24" y="212">- Edge cases: context cancellation, backoff cap, wrap the last error</text>
  <text class="dim" x="24" y="244">⏱ thinking 8.9s</text>

  <line class="rule" x1="24" y1="266" x2="876" y2="266"/>

  <text class="write" x="24" y="300">✍️ WRITING · claude</text>
  <text class="dim" x="240" y="300">sonnet · low</text>

  <text class="txt" x="24" y="332">client.go updated — withRetry retries n times, the wait is capped</text>
  <text class="txt" x="24" y="356">at 30s, and it returns immediately if the context is cancelled.</text>
  <text class="dim" x="24" y="388">⏱ writing 24.1s</text>
  <text class="dim" x="24" y="412">⏱ total 33.0s   (thinking 8.9s + writing 24.1s)</text>

  <line class="rule" x1="24" y1="432" x2="876" y2="432"/>
  <text class="dim" x="24" y="456">The expensive model plans · the cheap one writes · the same work is not billed twice</text>
</svg>
