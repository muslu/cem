<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <style>
    .bg{fill:#11151c} .bar{fill:#1c2330} .dim{fill:#7c8798} .txt{fill:#d6dde8}
    .think{fill:#7fb2ff;font-weight:700} .write{fill:#7fd39b;font-weight:700}
    .cmd{fill:#ffd479} .rule{stroke:#303a4a;stroke-width:1}
  </style>

  <rect class="bg" x="0" y="0" width="900" height="470" rx="10"/>
  <rect class="bar" x="0" y="0" width="900" height="34"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="17" r="6" fill="#febc2e"/>
  <circle cx="62" cy="17" r="6" fill="#28c840"/>
  <text class="dim" x="88" y="22">cem — pair mode</text>

  <text class="dim" x="24" y="70">$</text>
  <text class="cmd" x="42" y="70">cem -p "client.go'ya retry ekle"</text>

  <text class="think" x="24" y="108">🧠 DÜŞÜNEN · gpt</text>
  <text class="dim" x="230" y="108">gpt-5.6-terra · xhigh</text>

  <text class="txt" x="24" y="140">- Dosya: client.go</text>
  <text class="txt" x="24" y="164">- Fonksiyon: func withRetry(fn func() error, n int) error</text>
  <text class="txt" x="24" y="188">- Yaklaşım: üstel backoff, her denemede bekleme iki katına çıkar</text>
  <text class="txt" x="24" y="212">- Kenar durumlar: context iptali, bekleme üst sınırı, son hatayı sarmala</text>
  <text class="dim" x="24" y="244">⏱ düşünme 8.9s</text>

  <line class="rule" x1="24" y1="266" x2="876" y2="266"/>

  <text class="write" x="24" y="300">✍️ YAZAN · claude</text>
  <text class="dim" x="230" y="300">sonnet · low</text>

  <text class="txt" x="24" y="332">client.go güncellendi — withRetry n kez yeniden dener, bekleme</text>
  <text class="txt" x="24" y="356">30s'de sınırlanır, context iptal edilirse anında döner.</text>
  <text class="dim" x="24" y="388">⏱ yazma 24.1s</text>
  <text class="dim" x="24" y="412">⏱ toplam 33.0s   (düşünme 8.9s + yazma 24.1s)</text>

  <line class="rule" x1="24" y1="432" x2="876" y2="432"/>
  <text class="dim" x="24" y="456">Pahalı model planlar · ucuz model yazar · aynı iş iki kez faturalanmaz</text>
</svg>
